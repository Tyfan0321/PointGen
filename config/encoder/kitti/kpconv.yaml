# KPConv encoder configuration for 3DMatch dataset

# Encoder configuration
encoder: 
  type: "kpconv"
  kpconv_layers: 5
  input_dim: 1
  init_dim: 64
  kernel_size: 15
  init_radius: 0.9
  init_sigma: 0.6

# Processor configuration
processor:
  kpconv_layers: 5
  voxel_size: 0.3
  init_radius: 0.9
  neighbor_limits: [35, 35, 36, 37, 41]
